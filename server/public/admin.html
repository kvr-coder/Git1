<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Git1 — Parent</title>
<style>
  :root { --bg:#0b1220; --card:#131c2e; --line:#22304a; --fg:#e8eef7; --mut:#8aa0c0;
          --accent:#3b82f6; --danger:#ef4444; --ok:#22c55e; --warn:#f59e0b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { position:sticky; top:0; background:var(--bg); padding:14px 16px;
           border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  header h1 { font-size:18px; margin:0; flex:1; }
  main { padding:14px 16px 40px; max-width:680px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:14px; margin:12px 0; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .grow { flex:1; min-width:0; }
  .mut { color:var(--mut); font-size:13px; }
  .name { font-weight:600; font-size:17px; }
  input { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line);
          background:#0e1626; color:var(--fg); font-size:16px; }
  button { padding:11px 14px; border-radius:10px; border:0; font-size:15px; font-weight:600;
           color:#fff; background:var(--accent); cursor:pointer; }
  button.sec { background:#24324c; }
  button.dng { background:var(--danger); }
  button.ok  { background:var(--ok); }
  button.warn{ background:var(--warn); color:#1a1306; }
  button:disabled { opacity:.5; }
  .pill { font-size:12px; padding:3px 9px; border-radius:999px; background:#24324c; color:var(--mut); }
  .pill.on { background:rgba(34,197,94,.18); color:#86efac; }
  .pill.off{ background:rgba(239,68,68,.18); color:#fca5a5; }
  .bar { height:8px; background:#0e1626; border-radius:99px; overflow:hidden; margin:8px 0; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  .btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .btns button { flex:1; min-width:90px; }
  h2 { font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut);
       margin:22px 4px 4px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
           background:#1f2a40; border:1px solid var(--line); padding:10px 16px; border-radius:10px;
           opacity:0; transition:.2s; pointer-events:none; max-width:90%; }
  .toast.show { opacity:1; }
  .hidden { display:none; }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin:14px -14px 12px; padding:0 12px; overflow-x:auto; }
  .tab { padding:10px 12px; font-size:13px; color:var(--mut); border:0; background:transparent; cursor:pointer;
         border-bottom:2px solid transparent; border-radius:0; }
  .tab.active { color:var(--fg); border-bottom-color:var(--accent); }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px;
          background:#1a2438; font-size:13px; cursor:default; }
  .chip .x { cursor:pointer; opacity:.6; padding:0 2px; }
  .chip .x:hover { opacity:1; color:var(--danger); }
  .field-label { font-size:12px; color:var(--mut); margin-bottom:4px; }
  .schday-btn { background:#1a2438; padding:8px 12px; border-radius:8px; cursor:pointer;
                font-size:13px; user-select:none; transition:.1s; }
  .schday-btn.on { background:var(--accent); color:#fff; }
  select { padding:11px; border-radius:10px; background:#0e1626; color:var(--fg);
           border:1px solid var(--line); font-size:15px; width:100%; }
  .quickrow { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .quickrow button { padding:10px 6px; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>Git1 — Parent</h1>
  <span id="serverPill" class="pill">…</span>
  <button id="pushBtn" class="sec hidden" onclick="togglePush()">🔔 Off</button>
  <button id="logoutBtn" class="sec hidden" onclick="logout()">Sign out</button>
</header>
<main>
  <!-- Login -->
  <div id="loginView" class="card">
    <div class="name" style="margin-bottom:10px">Sign in</div>
    <div style="display:grid; gap:10px">
      <input id="email" type="email" autocomplete="username" placeholder="email" />
      <input id="password" type="password" autocomplete="current-password" placeholder="password" />
      <input id="invite" type="password" autocomplete="off" placeholder="invite code" class="hidden" />
      <button onclick="login()">Sign in</button>
      <div class="mut">Uses your Git1 parent account (same as the app). <a href="#" onclick="document.getElementById('invite').classList.remove('hidden');this.style.display='none';return false;" style="color:#7aa2ff">New here? Add invite code</a></div>
    </div>
  </div>

  <!-- App -->
  <div id="appView" class="hidden">
    <div id="requests"></div>
    <div id="chores"></div>
    <h2>Devices</h2>
    <div id="devices"></div>
    <div class="card">
      <div class="row">
        <input id="pairCode" class="grow" inputmode="numeric" maxlength="6" placeholder="6-digit pair code" />
        <button class="sec" onclick="pair()">Pair</button>
      </div>
    </div>

    <h2>Photo check-ins</h2>
    <div id="photos" class="card mut">No photos yet.</div>

    <h2>Co-parent</h2>
    <div class="card">
      <div class="row">
        <button class="sec" onclick="inviteCoParent()">Invite co-parent</button>
        <input id="coCode" class="grow" inputmode="numeric" maxlength="6" placeholder="enter co-parent code" />
        <button class="sec" onclick="claimCoParent()">Join</button>
      </div>
      <div class="mut" id="coStatus" style="margin-top:8px"></div>
    </div>
  </div>
</main>
<div id="toast" class="toast"></div>

<script>
const API = location.origin;
let TOKEN = localStorage.getItem('git1_token') || '';
let timer = null;

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }

async function api(path, opts={}){
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if (TOKEN) headers.Authorization = 'Bearer '+TOKEN;
  // Never let the browser cache our state — otherwise deletes/edits stay visible
  // until a hard refresh because GET responses come back from the disk cache.
  const final = Object.assign({}, opts, {headers, cache: 'no-store'});
  const res = await fetch(API+path, final);
  if (res.status === 401){ logout(); throw new Error('Session expired'); }
  if (!res.ok){ let e; try{e=(await res.json()).error}catch{}; throw new Error(e||('HTTP '+res.status)); }
  return res.status===204 ? null : res.json();
}

async function login(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const invite=document.getElementById('invite').value.trim();
  try{
    let r;
    try {
      r = await api('/auth/login',{method:'POST',body:JSON.stringify({email,password})});
    } catch(e){
      // Only attempt to register if the user actively provided an invite code.
      // Otherwise show the real login error (was masked as "invalid invite code"
      // because the old code blindly fell through to register on any login error).
      if (!invite) throw e;
      r = await api('/auth/register',{method:'POST',body:JSON.stringify({email,password,invite})});
    }
    TOKEN=r.token; localStorage.setItem('git1_token',TOKEN);
    showApp();
  }catch(e){ toast(e.message); }
}
function logout(){ TOKEN=''; localStorage.removeItem('git1_token'); clearInterval(timer);
  document.getElementById('appView').classList.add('hidden');
  document.getElementById('loginView').classList.remove('hidden');
  document.getElementById('logoutBtn').classList.add('hidden');
  document.getElementById('pushBtn').classList.add('hidden'); }

function showApp(){
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  document.getElementById('logoutBtn').classList.remove('hidden');
  document.getElementById('pushBtn').classList.remove('hidden');
  refreshPushState();
  forceRefresh(); clearInterval(timer); timer=setInterval(refresh,5000);
}

// ----- Web Push (instant phone notifications, no Expo/Apple Dev) -----
function b64ToUint8(b64){ const p='='.repeat((4 - b64.length % 4) % 4);
  const s=(b64+p).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(s); return Uint8Array.from([...raw].map(c=>c.charCodeAt(0))); }

async function ensureSW(){
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return null;
  return navigator.serviceWorker.register('/sw.js');
}

async function refreshPushState(){
  const btn = document.getElementById('pushBtn');
  if (!('serviceWorker' in navigator) || !('PushManager' in window)){
    btn.classList.add('hidden'); return;
  }
  const reg = await navigator.serviceWorker.getRegistration('/sw.js');
  const sub = reg && await reg.pushManager.getSubscription();
  btn.textContent = sub ? '🔔 On' : '🔔 Off';
  btn.classList.toggle('ok', !!sub);
}

async function togglePush(){
  try {
    const reg = await ensureSW();
    if (!reg) return toast('This browser doesn\'t support push. On iPhone: Share → Add to Home Screen, then re-open.');
    const existing = await reg.pushManager.getSubscription();
    if (existing){
      await api('/webpush/unsubscribe',{method:'POST',body:JSON.stringify({endpoint:existing.endpoint})});
      await existing.unsubscribe();
      toast('Notifications off'); return refreshPushState();
    }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return toast('Permission denied — enable in browser settings.');
    const {key} = await api('/webpush/key');
    const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ToUint8(key) });
    await api('/webpush/subscribe',{method:'POST',body:JSON.stringify(sub.toJSON())});
    await api('/webpush/test',{method:'POST'});
    toast('Notifications on — test sent'); refreshPushState();
  } catch(e){ toast(e.message || 'Push failed'); }
}

function fmt(m){ m=Math.round(m||0); return (m>=60?Math.floor(m/60)+'h ':'')+(m%60)+'m'; }

async function cmd(id, kind, payload){
  try{ await api('/devices/'+id+'/command',{method:'POST',body:JSON.stringify({kind,payload})});
       toast(kind.replace(/_/g,' ')); setTimeout(refresh,400); }
  catch(e){ toast(e.message); }
}
// Lock + Internet are now stateful toggles. Optimistically update the card so
// the button label/colour flips the moment you click, then sync with the
// server. If the server rejects, /devices will correct it on the next refresh.
async function toggleLock(id, wantLocked){
  paintLockBtn(id, wantLocked);
  try{
    await api('/devices/'+id+'/command',{method:'POST',body:JSON.stringify({kind: wantLocked?'lock':'unlock'})});
    toast(wantLocked?'Locked':'Unlocked');
    await forceRefresh();
  }catch(e){ toast(e.message); await forceRefresh(); }
}
async function toggleNet(id, wantOn){
  paintNetBtn(id, !wantOn);  // !wantOn => internetBlocked
  try{
    await api('/devices/'+id+'/command',{method:'POST',body:JSON.stringify({kind: wantOn?'unblock_internet':'block_internet'})});
    toast(wantOn?'Internet ON':'Internet OFF');
    await forceRefresh();
  }catch(e){ toast(e.message); await forceRefresh(); }
}
// Effective lock state: parent-pressed Lock OR active schedule lock.
function lockedNow(d){ return !!(d.lockedByParent || d.status === 'locked'); }
function lockReason(d){
  if (d.lockedByParent) return 'Locked by you';
  if (d.status === 'locked') return 'Locked by schedule';
  return 'Unlocked';
}
function renderLockBadge(d){
  const locked = lockedNow(d);
  const reason = lockReason(d);
  return `<span data-role="lockBadge" style="padding:3px 9px;border-radius:999px;background:${locked?'rgba(239,68,68,.18)':'rgba(34,197,94,.18)'};color:${locked?'#fca5a5':'#86efac'}">${locked?'🔒':'🔓'} ${reason}</span>`;
}
function renderNetBadge(d){
  const blocked = !!d.internetBlocked;
  return `<span data-role="netBadge" style="padding:3px 9px;border-radius:999px;background:${blocked?'rgba(245,158,11,.18)':'rgba(34,197,94,.18)'};color:${blocked?'#fbbf24':'#86efac'}">${blocked?'🚫':'🌐'} Internet ${blocked?'OFF':'ON'}</span>`;
}
function paintLockBtn(id, lockedFlag, statusOverride){
  const card = document.querySelector('#devices .card[data-device="'+id+'"]'); if(!card) return;
  const b = card.querySelector('[data-role="lockBtn"]'); if(!b) return;
  const fakeD = { lockedByParent: !!lockedFlag, status: statusOverride || (lockedFlag?'locked':'online') };
  const locked = lockedNow(fakeD);
  b.textContent = locked ? '🔓 Unlock' : '🔒 Lock';
  b.className = locked ? 'ok' : 'dng';
  b.setAttribute('onclick', `toggleLock('${id}',${!locked})`);
  const badge = card.querySelector('[data-role="lockBadge"]');
  if (badge) badge.outerHTML = renderLockBadge(fakeD);
}
function paintNetBtn(id, blocked){
  const card = document.querySelector('#devices .card[data-device="'+id+'"]'); if(!card) return;
  const b = card.querySelector('[data-role="netBtn"]'); if(!b) return;
  b.textContent = blocked ? '🚫 Internet OFF' : '🌐 Internet ON';
  b.className = blocked ? 'warn' : 'ok';
  b.setAttribute('onclick', `toggleNet('${id}',${blocked?true:false})`);
  const badge = card.querySelector('[data-role="netBadge"]');
  if (badge) badge.outerHTML = renderNetBadge({ internetBlocked: !!blocked });
}
async function resolve(kind, id, status, minutes){
  const body = minutes!=null ? {status,minutes} : {status};
  try{ await api('/'+kind+'/'+id+'/resolve',{method:'POST',body:JSON.stringify(body)});
       toast(status); forceRefresh(); }catch(e){ toast(e.message); }
}
async function pair(){
  const code=document.getElementById('pairCode').value.trim();
  if(code.length!==6) return toast('Enter the 6-digit code');
  try{ await api('/devices/pair',{method:'POST',body:JSON.stringify({code})});
       document.getElementById('pairCode').value=''; toast('Paired!'); forceRefresh(); }
  catch(e){ toast(e.message); }
}

async function refresh(){
  try{
    const [devices, reqs, chores, photos, cop, scheds] = await Promise.all([
      api('/devices'), api('/requests?status=pending'), api('/chores?status=pending'),
      api('/photos').catch(()=>[]), api('/co-parents').catch(()=>[]),
      api('/schedules').catch(()=>[]),
    ]);
    SCHEDULES = scheds || [];
    renderRequests(reqs); renderChores(chores);
    // Strategy: full re-render only when safe (no open panel, no focused input).
    // Otherwise update LIVE STATS in place (status pill, used/limit, bar,
    // last seen, online/offline) without touching the Settings panel HTML —
    // so day-chip selections, half-typed values, etc. survive the 5s tick.
    const ae = document.activeElement;
    const inDevices = ae && document.getElementById('devices').contains(ae);
    const anyPanelOpen = OPEN_PANELS.size > 0;
    if (!inDevices && !anyPanelOpen) {
      renderDevices(devices);
    } else {
      updateDeviceStatsInPlace(devices);
    }
    renderPhotos(photos); renderCoParents(cop);
  }catch(e){ /* 401 already handled */ }
}

function renderPhotos(list){
  const el=document.getElementById('photos');
  if(!list || !list.length){ el.innerHTML='<div class="mut">No photos yet.</div>'; return; }
  el.innerHTML = '<div class="row" style="gap:8px;flex-wrap:wrap">'+list.slice(0,12).map(p=>`
    <a href="/photos/${p.id}" target="_blank" style="display:block">
      <img src="/photos/${p.id}" style="width:90px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line)"
           onerror="this.style.background='#24324c'" />
      <div class="mut" style="font-size:11px;max-width:90px">${esc(p.caption||ago(p.capturedAt))}</div>
    </a>`).join('')+'</div>';
}

function renderCoParents(list){
  const el=document.getElementById('coStatus');
  if(!el) return;
  el.textContent = list.length ? `Linked with ${list.length} other parent(s).` : 'No co-parent linked yet.';
}

async function inviteCoParent(){
  try{
    const r = await api('/co-parents/invite',{method:'POST'});
    const el = document.getElementById('coStatus');
    if(el) el.innerHTML = `Code for other parent: <b style="font-size:18px;letter-spacing:2px;color:var(--ok)">${r.code}</b> <button class="sec" style="padding:6px 10px" onclick="navigator.clipboard.writeText('${r.code}');toast('Copied!')">Copy</button> <span class="mut">(expires in 24h)</span>`;
  } catch(e){ toast(e.message); }
}
async function claimCoParent(){
  const code = document.getElementById('coCode').value.trim();
  if(code.length!==6) return toast('Enter the 6-digit code');
  try{ await api('/co-parents/claim',{method:'POST',body:JSON.stringify({code})});
       document.getElementById('coCode').value=''; toast('Linked!'); forceRefresh(); }
  catch(e){ toast(e.message); }
}
async function recoverDevice(id){ return showRecoveryCode(id); }
async function showRecoveryCode(id){
  try{
    const r = await api('/devices/'+id+'/recovery-code',{method:'POST'});
    const el = document.getElementById('rc_'+id);
    if(el) el.innerHTML = `Recovery code: <b style="font-size:18px;letter-spacing:2px;color:var(--ok)">${r.code}</b> <button class="sec" style="padding:6px 10px" onclick="navigator.clipboard.writeText('${r.code}');toast('Copied!')">Copy</button><br><span class="mut">Enter on the kid PC via Repair-Pair-Git1.bat (expires 10 min)</span>`;
  } catch(e){ toast(e.message); }
}
async function addGeofenceInline(deviceId){
  const name = (document.getElementById('gn_'+deviceId).value||'').trim();
  if(!name) return toast('Enter a geofence name');
  const radius = +document.getElementById('gr_'+deviceId).value || 150;
  if(!navigator.geolocation) return toast('Geolocation not supported');
  toast('Capturing your current location…');
  navigator.geolocation.getCurrentPosition(async pos=>{
    try{
      await api('/geofences',{method:'POST',body:JSON.stringify({
        deviceId, name, lat:pos.coords.latitude, lng:pos.coords.longitude,
        radiusMeters:radius, notifyOnEnter:true, notifyOnExit:true,
      })});
      document.getElementById('gn_'+deviceId).value='';
      toast('Geofence added');
    }catch(e){ toast(e.message); }
  }, err=>toast('Location error: '+err.message), {enableHighAccuracy:true});
}
async function addGeofence(deviceId){ /* legacy no-op; the More tab now has the form */ }

let SCHEDULES = [];
let OPEN_PANELS = new Set();        // device IDs whose Settings panel is open
let ACTIVE_TAB = new Map();         // deviceId -> active tab key (persists across refresh)
let EDITING_FIELDS = new Set();     // input IDs the user is currently typing in
const DAYS = ['mon','tue','wed','thu','fri','sat','sun'];
function hhmm(min){ const h=Math.floor(min/60), m=min%60; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }
function toMin(s){ const [h,m]=String(s).split(':').map(Number); return (h||0)*60+(m||0); }

function updateDeviceStatsInPlace(list){
  for (const d of list){
    const card = document.querySelector(`#devices .card[data-device="${d.id}"]`);
    if (!card) continue; // not rendered yet — wait for the next safe re-render
    const online = d.status!=='offline';
    const pct = d.dailyLimitMinutes ? Math.min(100, 100*d.usedTodayMinutes/d.dailyLimitMinutes) : 0;
    const pill = card.querySelector('[data-role="pill"]');
    if (pill){ pill.textContent = online?'online':'offline'; pill.className = 'pill '+(online?'on':'off'); pill.dataset.role='pill'; }
    const seen = card.querySelector('[data-role="seen"]');
    if (seen) seen.textContent = d.status + (d.lastSeen?(' · seen '+ago(d.lastSeen)):'');
    const bar = card.querySelector('[data-role="bar"]');
    if (bar) bar.style.width = pct+'%';
    const stats = card.querySelector('[data-role="stats"]');
    if (stats) stats.textContent = fmt(d.usedTodayMinutes)+' / '+fmt(d.dailyLimitMinutes)+' today · bank '+fmt(d.bankedMinutes);
    const tamper = card.querySelector('[data-role="tamper"]');
    if (tamper) tamper.style.display = d.tamperSuspected ? '' : 'none';
    // Reflect authoritative state on the toggles, so the button label/colour
    // matches reality even if the agent rejected/applied the command.
    paintLockBtn(d.id, !!d.lockedByParent, d.status);
    paintNetBtn(d.id, !!d.internetBlocked);
  }
}

function renderDevices(list){
  const el=document.getElementById('devices');
  if(!list.length){ el.innerHTML='<div class="card mut">No devices yet. Pair one below.</div>'; return; }
  el.innerHTML = list.map(d=>{
    const pct = d.dailyLimitMinutes? Math.min(100, 100*d.usedTodayMinutes/d.dailyLimitMinutes):0;
    const online = d.status!=='offline';
    const net = d.internetBlocked;
    const scheds = SCHEDULES.filter(s=>s.deviceId===d.id);
    const blocklist = (d.blocklist||[]).join(', ');
    const at = ACTIVE_TAB.get(d.id) || 'time';   // which settings tab is active
    return `<div class="card" data-device="${d.id}">
      <div class="row">
        <div class="grow"><span class="name">${esc(d.name)}</span>
          <div class="mut" data-role="seen">${d.status}${d.lastSeen?(' · seen '+ago(d.lastSeen)):''}</div></div>
        <span class="pill ${online?'on':'off'}" data-role="pill">${online?'online':'offline'}</span>
      </div>
      <div data-role="tamper" style="${d.tamperSuspected?'':'display:none'};margin:8px 0;padding:10px;border-radius:10px;background:rgba(239,68,68,.15);border:1px solid var(--danger);color:#fca5a5;font-size:13px">
        ⚠ Agent stopped reporting — the app may have been closed, killed, or its internet blocked. Possible tampering.
      </div>
      <div class="bar"><i data-role="bar" style="width:${pct}%"></i></div>
      <div class="mut" data-role="stats">${fmt(d.usedTodayMinutes)} / ${fmt(d.dailyLimitMinutes)} today · bank ${fmt(d.bankedMinutes)}</div>

      <div class="btns">
        <button data-role="lockBtn" class="${(d.lockedByParent || d.status==='locked') ? 'ok':'dng'}" onclick="toggleLock('${d.id}',${!(d.lockedByParent || d.status==='locked')})">
          ${(d.lockedByParent || d.status==='locked') ? '🔓 Unlock' : '🔒 Lock'}
        </button>
        <button class="sec" onclick="cmd('${d.id}','grant_minutes',{minutes:15})">+15 min</button>
        <button data-role="netBtn" class="${net?'warn':'ok'}" onclick="toggleNet('${d.id}',${net?false:true})">
          ${net?'🚫 Internet OFF':'🌐 Internet ON'}
        </button>
      </div>
      <div class="mut" data-role="stateLine" style="font-size:13px;margin-top:8px;display:flex;flex-wrap:wrap;gap:10px">
        ${renderLockBadge(d)} ${renderNetBadge(d)}
      </div>

async function loadStats(deviceId){
  const chart = document.getElementById('stats_chart_'+deviceId);
  const apps = document.getElementById('stats_apps_'+deviceId);
  if (!chart || !apps) return;
  try {
    const r = await api('/devices/'+deviceId+'/stats?days=14');
    const days = (r.daily || []).slice().reverse();           // oldest -> newest
    if (!days.length) {
      chart.innerHTML = '<div class="mut" style="font-size:13px;align-self:center;margin:auto">No data yet — usage starts being tracked once the agent runs for a few minutes.</div>';
      apps.innerHTML = '<div class="mut" style="font-size:13px">No app data yet.</div>';
      return;
    }
    const max = Math.max(60, ...days.map(d=>d.totalMinutes));
    chart.innerHTML = days.map(d=>{
      const h = Math.max(2, Math.round((d.totalMinutes/max)*100));
      const lbl = d.date.slice(5);   // MM-DD
      return `<div title="${esc(d.date)}: ${fmt(d.totalMinutes)}" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">
        <div style="width:100%;height:${h}%;background:var(--accent);border-radius:4px 4px 0 0"></div>
        <div class="mut" style="font-size:10px;margin-top:4px">${esc(lbl)}</div>
        <div class="mut" style="font-size:10px">${fmt(d.totalMinutes)}</div>
      </div>`;
    }).join('');
    const today = days[days.length-1];
    const entries = Object.entries(today.appUsage || {}).sort((a,b)=>b[1]-a[1]);
    if (!entries.length) {
      apps.innerHTML = '<div class="mut" style="font-size:13px">No app activity captured today yet.</div>';
    } else {
      const topMax = Math.max(1, entries[0][1]);
      apps.innerHTML = entries.slice(0,15).map(([name,mins])=>`
        <div style="margin:6px 0">
          <div class="row" style="gap:8px;margin-bottom:2px;font-size:13px">
            <span class="grow">${esc(name)}</span>
            <span class="mut">${fmt(Math.round(mins))}</span>
          </div>
          <div class="bar" style="height:6px;margin:0"><i style="width:${Math.round(mins/topMax*100)}%"></i></div>
        </div>`).join('');
    }
  } catch(e){
    chart.innerHTML = '<div class="mut" style="font-size:13px;align-self:center;margin:auto">Could not load stats: '+esc(e.message)+'</div>';
  }
}

function selectTab(btn, deviceId){
  const tabs = btn.parentNode.querySelectorAll('.tab');
  tabs.forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  const targetId = btn.dataset.tab;
  const panels = btn.parentNode.parentNode.querySelectorAll('.tab-panel');
  panels.forEach(p=>p.classList.toggle('active', p.id===targetId));
  // Remember the active tab so the 5s auto-refresh doesn't snap back to Time.
  ACTIVE_TAB.set(deviceId, targetId.split('_')[0]);
}

async function addApp(deviceId){
  const el = document.getElementById('ba_'+deviceId);
  const name = el.value.trim().toLowerCase();
  if(!name) return;
  await pushBlocklist(deviceId, prev=>[...new Set([...(prev||[]), name])]);
  el.value='';
}
async function addAppDirect(deviceId, name){
  await pushBlocklist(deviceId, prev=>[...new Set([...(prev||[]), name])]);
}
async function removeApp(deviceId, name){
  await pushBlocklist(deviceId, prev=>(prev||[]).filter(a=>a!==name));
}
async function addAlwaysApp(deviceId){
  const el = document.getElementById('aba_'+deviceId);
  const name = el.value.trim().toLowerCase();
  if(!name) return;
  await pushAlwaysBlocklist(deviceId, prev=>[...new Set([...(prev||[]), name])]);
  el.value='';
}
async function removeAlwaysApp(deviceId, name){
  await pushAlwaysBlocklist(deviceId, prev=>(prev||[]).filter(a=>a!==name));
}
async function pushAlwaysBlocklist(deviceId, fn){
  try{
    const devs = await api('/devices');
    const d = devs.find(x=>x.id===deviceId); if(!d) return;
    const next = fn(d.alwaysBlocklist||[]);
    d.alwaysBlocklist = next;
    renderDevices(devs);
    await api('/devices/'+deviceId+'/command',{method:'POST',body:JSON.stringify({kind:'set_always_blocklist',payload:{apps:next}})});
    toast('Always-block list updated');
    await forceRefresh();
  } catch(e){ toast(e.message); await forceRefresh(); }
}

async function pushBlocklist(deviceId, fn){
  try{
    const devs = await api('/devices');
    const d = devs.find(x=>x.id===deviceId); if(!d) return;
    const next = fn(d.blocklist||[]);
    // Optimistic local update so the chip disappears immediately on Remove.
    d.blocklist = next;
    renderDevices(devs);
    await api('/devices/'+deviceId+'/command',{method:'POST',body:JSON.stringify({kind:'set_blocklist',payload:{apps:next}})});
    toast('Blocklist updated');
    await forceRefresh();
  } catch(e){ toast(e.message); await forceRefresh(); }
}

async function addChoreTemplate(deviceId){
  const description = (document.getElementById('ctd_'+deviceId).value||'').trim();
  const minutes = +document.getElementById('ctm_'+deviceId).value || 15;
  if(!description) return toast('Enter a chore description');
  try{
    await api('/devices/'+deviceId+'/chore-templates',{method:'POST',body:JSON.stringify({description, minutes})});
    document.getElementById('ctd_'+deviceId).value='';
    toast('Chore added'); forceRefresh();
  } catch(e){ toast(e.message); }
}
async function delChoreTemplate(deviceId, templateId){
  try{
    await api('/devices/'+deviceId+'/chore-templates/'+templateId,{method:'DELETE'});
    toast('Removed');
    await forceRefresh();
  } catch(e){ toast(e.message); }
}

function setDays(deviceId, days){
  document.querySelectorAll('#sd_'+deviceId+' .schday-btn').forEach(b=>{
    b.classList.toggle('on', days.includes(b.dataset.day));
  });
}
function applyPreset(deviceId, kind){
  const presets = {
    bedtime:  { name:'Bedtime', days:DAYS, start:'21:00', end:'07:00', actions:['lock','block_internet'] },
    school:   { name:'School hours', days:['mon','tue','wed','thu','fri'], start:'08:00', end:'15:00', actions:['lock'] },
    morning:  { name:'Screen-free morning', days:['sat','sun'], start:'07:00', end:'09:00', actions:['lock','block_internet'] },
    dinner:   { name:'Dinner', days:DAYS, start:'18:00', end:'19:30', actions:['lock'] },
  };
  const p = presets[kind]; if(!p) return;
  document.getElementById('sn_'+deviceId).value = p.name;
  setDays(deviceId, p.days);
  document.getElementById('ss_'+deviceId).value = p.start;
  document.getElementById('se_'+deviceId).value = p.end;
  document.querySelectorAll('#sa_'+deviceId+' .schday-btn').forEach(b=>{
    b.classList.toggle('on', p.actions.includes(b.dataset.action));
  });
}
async function saveSchedule(deviceId){
  const name=(document.getElementById('sn_'+deviceId).value||'').trim() || 'Schedule';
  const days=[...document.querySelectorAll('#sd_'+deviceId+' .schday-btn.on')].map(b=>b.dataset.day);
  if(!days.length) return toast('Pick at least one day');
  const start=document.getElementById('ss_'+deviceId).value;
  const end=document.getElementById('se_'+deviceId).value;
  if(!start||!end) return toast('Pick start and end times');
  const actions=[...document.querySelectorAll('#sa_'+deviceId+' .schday-btn.on')].map(b=>b.dataset.action);
  if(!actions.length) return toast('Pick at least one action (Lock, Block internet, or Block apps)');
  const id='sch_'+Math.random().toString(36).slice(2,10);
  try{
    await api('/schedules/'+id,{method:'PUT',body:JSON.stringify({
      deviceId, name, days, startMinute:toMin(start), endMinute:toMin(end), enabled:true, actions
    })});
    toast('Schedule added'); await forceRefresh();
  }catch(e){ toast(e.message); }
}
async function toggleScheduleEnabled(deviceId, schedId, on){
  const s = SCHEDULES.find(x=>x.id===schedId); if(!s) return;
  try{
    await api('/schedules/'+schedId,{method:'PUT',body:JSON.stringify({
      deviceId: s.deviceId, name: s.name, days: s.days,
      startMinute: s.startMinute, endMinute: s.endMinute,
      enabled: !!on, actions: s.actions||['lock']
    })});
    toast(on?'Schedule resumed':'Schedule paused'); await forceRefresh();
  }catch(e){ toast(e.message); }
}
async function forceRefresh(){
  // Used after a deliberate save action — bypasses the "panel open" guard so
  // the user sees their change appear in the list immediately.
  try{
    const [devices, scheds] = await Promise.all([api('/devices'), api('/schedules').catch(()=>[])]);
    SCHEDULES = scheds || [];
    renderDevices(devices);
  }catch(e){ /* ignore */ }
}
function armDelete(id, name){
  const host = document.getElementById('del_'+id);
  if(!host) return;
  host.innerHTML = `
    <div style="background:#1a0e0e;border:1px solid var(--danger);border-radius:10px;padding:12px;margin-top:8px">
      <div style="margin-bottom:8px"><b>Delete "${esc(name)}"?</b></div>
      <div class="mut" style="font-size:13px;margin-bottom:10px">This wipes all settings, schedules, history, and unpairs the agent. The kid PC will need to be re-paired to be controlled again.</div>
      <div class="row" style="gap:8px">
        <button class="sec grow" onclick="cancelDelete('${id}','${esc(name)}')">Cancel</button>
        <button class="dng grow" onclick="confirmDelete('${id}')">Yes, delete</button>
      </div>
    </div>`;
}
function cancelDelete(id, name){
  const host = document.getElementById('del_'+id);
  if(host) host.innerHTML = `<button class="dng" onclick="armDelete('${id}','${name}')" style="width:100%;margin-top:8px">🗑 Delete device</button>`;
}
async function confirmDelete(id){
  try{ await api('/devices/'+id,{method:'DELETE'}); toast('Deleted'); forceRefresh(); }
  catch(e){ toast(e.message); }
}
// Keep legacy fn name in case anything calls it.
async function deleteDevice(id, name){ armDelete(id, name); }
async function delSchedule(id){
  // Optimistic update first so the UI changes instantly, then sync server + re-fetch.
  SCHEDULES = SCHEDULES.filter(s=>s.id!==id);
  try{
    await api('/schedules/'+id,{method:'DELETE'});
    toast('Removed');
    await forceRefresh();
  }catch(e){ toast(e.message); await forceRefresh(); }
}
function renderRequests(list){
  const el=document.getElementById('requests');
  if(!list.length){ el.innerHTML=''; return; }
  el.innerHTML='<h2>Time requests</h2>'+list.map(r=>`<div class="card">
    <div class="name">${r.minutes} min</div>
    <div class="mut">${esc(r.reason||'no reason given')}</div>
    <div class="btns">
      <button class="ok"  onclick="resolve('requests','${r.id}','approved')">Approve</button>
      <button class="dng" onclick="resolve('requests','${r.id}','denied')">Deny</button>
    </div></div>`).join('');
}
function renderChores(list){
  const el=document.getElementById('chores');
  if(!list.length){ el.innerHTML=''; return; }
  el.innerHTML='<h2>Chores</h2>'+list.map(c=>`<div class="card">
    <div class="name">${esc(c.description||'chore')}</div>
    <div class="row" style="margin-top:8px">
      <input id="cm_${c.id}" class="grow" type="number" value="${c.minutes||0}" style="max-width:110px" />
      <span class="mut">min reward</span>
    </div>
    <div class="btns">
      <button class="ok" onclick="resolve('chores','${c.id}','approved', +document.getElementById('cm_${c.id}').value)">Approve</button>
      <button class="dng" onclick="resolve('chores','${c.id}','denied')">Deny</button>
    </div></div>`).join('');
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function ago(ts){ const s=Math.max(0,(Date.now()-ts)/1000);
  if(s<60)return Math.floor(s)+'s ago'; if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; }

// boot
fetch(API+'/health').then(()=>{document.getElementById('serverPill').textContent='✓ live';
  document.getElementById('serverPill').className='pill on';})
  .catch(()=>{document.getElementById('serverPill').textContent='offline';
  document.getElementById('serverPill').className='pill off';});
if (TOKEN) showApp();
</script>
