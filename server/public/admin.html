<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Git1 — Parent</title>
<style>
  :root { --bg:#0b1220; --card:#131c2e; --line:#22304a; --fg:#e8eef7; --mut:#8aa0c0;
          --accent:#3b82f6; --danger:#ef4444; --ok:#22c55e; --warn:#f59e0b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { position:sticky; top:0; background:var(--bg); padding:14px 16px;
           border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  header h1 { font-size:18px; margin:0; flex:1; }
  main { padding:14px 16px 40px; max-width:680px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:14px; margin:12px 0; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .grow { flex:1; min-width:0; }
  .mut { color:var(--mut); font-size:13px; }
  .name { font-weight:600; font-size:17px; }
  input { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line);
          background:#0e1626; color:var(--fg); font-size:16px; }
  button { padding:11px 14px; border-radius:10px; border:0; font-size:15px; font-weight:600;
           color:#fff; background:var(--accent); cursor:pointer; }
  button.sec { background:#24324c; }
  button.dng { background:var(--danger); }
  button.ok  { background:var(--ok); }
  button.warn{ background:var(--warn); color:#1a1306; }
  button:disabled { opacity:.5; }
  .pill { font-size:12px; padding:3px 9px; border-radius:999px; background:#24324c; color:var(--mut); }
  .pill.on { background:rgba(34,197,94,.18); color:#86efac; }
  .pill.off{ background:rgba(239,68,68,.18); color:#fca5a5; }
  .bar { height:8px; background:#0e1626; border-radius:99px; overflow:hidden; margin:8px 0; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  .btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .btns button { flex:1; min-width:90px; }
  h2 { font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut);
       margin:22px 4px 4px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
           background:#1f2a40; border:1px solid var(--line); padding:10px 16px; border-radius:10px;
           opacity:0; transition:.2s; pointer-events:none; max-width:90%; }
  .toast.show { opacity:1; }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <h1>Git1 — Parent</h1>
  <span id="serverPill" class="pill">…</span>
  <button id="pushBtn" class="sec hidden" onclick="togglePush()">🔔 Off</button>
  <button id="logoutBtn" class="sec hidden" onclick="logout()">Sign out</button>
</header>
<main>
  <!-- Login -->
  <div id="loginView" class="card">
    <div class="name" style="margin-bottom:10px">Sign in</div>
    <div style="display:grid; gap:10px">
      <input id="email" type="email" autocomplete="username" placeholder="email" />
      <input id="password" type="password" autocomplete="current-password" placeholder="password" />
      <input id="invite" type="password" autocomplete="off" placeholder="invite code" class="hidden" />
      <button onclick="login()">Sign in</button>
      <div class="mut">Uses your Git1 parent account (same as the app). <a href="#" onclick="document.getElementById('invite').classList.remove('hidden');this.style.display='none';return false;" style="color:#7aa2ff">New here? Add invite code</a></div>
    </div>
  </div>

  <!-- App -->
  <div id="appView" class="hidden">
    <div id="requests"></div>
    <div id="chores"></div>
    <h2>Devices</h2>
    <div id="devices"></div>
    <div class="card">
      <div class="row">
        <input id="pairCode" class="grow" inputmode="numeric" maxlength="6" placeholder="6-digit pair code" />
        <button class="sec" onclick="pair()">Pair</button>
      </div>
    </div>

    <h2>Photo check-ins</h2>
    <div id="photos" class="card mut">No photos yet.</div>

    <h2>Co-parent</h2>
    <div class="card">
      <div class="row">
        <button class="sec" onclick="inviteCoParent()">Invite co-parent</button>
        <input id="coCode" class="grow" inputmode="numeric" maxlength="6" placeholder="enter co-parent code" />
        <button class="sec" onclick="claimCoParent()">Join</button>
      </div>
      <div class="mut" id="coStatus" style="margin-top:8px"></div>
    </div>
  </div>
</main>
<div id="toast" class="toast"></div>

<script>
const API = location.origin;
let TOKEN = localStorage.getItem('git1_token') || '';
let timer = null;

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }

async function api(path, opts={}){
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if (TOKEN) headers.Authorization = 'Bearer '+TOKEN;
  const res = await fetch(API+path, Object.assign({}, opts, {headers}));
  if (res.status === 401){ logout(); throw new Error('Session expired'); }
  if (!res.ok){ let e; try{e=(await res.json()).error}catch{}; throw new Error(e||('HTTP '+res.status)); }
  return res.status===204 ? null : res.json();
}

async function login(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const invite=document.getElementById('invite').value.trim();
  try{
    let r;
    try {
      r = await api('/auth/login',{method:'POST',body:JSON.stringify({email,password})});
    } catch(e){
      // Only attempt to register if the user actively provided an invite code.
      // Otherwise show the real login error (was masked as "invalid invite code"
      // because the old code blindly fell through to register on any login error).
      if (!invite) throw e;
      r = await api('/auth/register',{method:'POST',body:JSON.stringify({email,password,invite})});
    }
    TOKEN=r.token; localStorage.setItem('git1_token',TOKEN);
    showApp();
  }catch(e){ toast(e.message); }
}
function logout(){ TOKEN=''; localStorage.removeItem('git1_token'); clearInterval(timer);
  document.getElementById('appView').classList.add('hidden');
  document.getElementById('loginView').classList.remove('hidden');
  document.getElementById('logoutBtn').classList.add('hidden');
  document.getElementById('pushBtn').classList.add('hidden'); }

function showApp(){
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  document.getElementById('logoutBtn').classList.remove('hidden');
  document.getElementById('pushBtn').classList.remove('hidden');
  refreshPushState();
  refresh(); clearInterval(timer); timer=setInterval(refresh,5000);
}

// ----- Web Push (instant phone notifications, no Expo/Apple Dev) -----
function b64ToUint8(b64){ const p='='.repeat((4 - b64.length % 4) % 4);
  const s=(b64+p).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(s); return Uint8Array.from([...raw].map(c=>c.charCodeAt(0))); }

async function ensureSW(){
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return null;
  return navigator.serviceWorker.register('/sw.js');
}

async function refreshPushState(){
  const btn = document.getElementById('pushBtn');
  if (!('serviceWorker' in navigator) || !('PushManager' in window)){
    btn.classList.add('hidden'); return;
  }
  const reg = await navigator.serviceWorker.getRegistration('/sw.js');
  const sub = reg && await reg.pushManager.getSubscription();
  btn.textContent = sub ? '🔔 On' : '🔔 Off';
  btn.classList.toggle('ok', !!sub);
}

async function togglePush(){
  try {
    const reg = await ensureSW();
    if (!reg) return toast('This browser doesn\'t support push. On iPhone: Share → Add to Home Screen, then re-open.');
    const existing = await reg.pushManager.getSubscription();
    if (existing){
      await api('/webpush/unsubscribe',{method:'POST',body:JSON.stringify({endpoint:existing.endpoint})});
      await existing.unsubscribe();
      toast('Notifications off'); return refreshPushState();
    }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return toast('Permission denied — enable in browser settings.');
    const {key} = await api('/webpush/key');
    const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ToUint8(key) });
    await api('/webpush/subscribe',{method:'POST',body:JSON.stringify(sub.toJSON())});
    await api('/webpush/test',{method:'POST'});
    toast('Notifications on — test sent'); refreshPushState();
  } catch(e){ toast(e.message || 'Push failed'); }
}

function fmt(m){ m=Math.round(m||0); return (m>=60?Math.floor(m/60)+'h ':'')+(m%60)+'m'; }

async function cmd(id, kind, payload){
  try{ await api('/devices/'+id+'/command',{method:'POST',body:JSON.stringify({kind,payload})});
       toast(kind.replace(/_/g,' ')); setTimeout(refresh,400); }
  catch(e){ toast(e.message); }
}
async function resolve(kind, id, status, minutes){
  const body = minutes!=null ? {status,minutes} : {status};
  try{ await api('/'+kind+'/'+id+'/resolve',{method:'POST',body:JSON.stringify(body)});
       toast(status); refresh(); }catch(e){ toast(e.message); }
}
async function pair(){
  const code=document.getElementById('pairCode').value.trim();
  if(code.length!==6) return toast('Enter the 6-digit code');
  try{ await api('/devices/pair',{method:'POST',body:JSON.stringify({code})});
       document.getElementById('pairCode').value=''; toast('Paired!'); refresh(); }
  catch(e){ toast(e.message); }
}

async function refresh(){
  try{
    const [devices, reqs, chores, photos, cop, scheds] = await Promise.all([
      api('/devices'), api('/requests?status=pending'), api('/chores?status=pending'),
      api('/photos').catch(()=>[]), api('/co-parents').catch(()=>[]),
      api('/schedules').catch(()=>[]),
    ]);
    SCHEDULES = scheds || [];
    renderRequests(reqs); renderChores(chores);
    // Don't blow away whatever input the user is currently editing.
    const ae = document.activeElement;
    const editing = ae && ae.tagName === 'INPUT' && document.getElementById('devices').contains(ae);
    if (!editing) renderDevices(devices);
    renderPhotos(photos); renderCoParents(cop);
  }catch(e){ /* 401 already handled */ }
}

function renderPhotos(list){
  const el=document.getElementById('photos');
  if(!list || !list.length){ el.innerHTML='<div class="mut">No photos yet.</div>'; return; }
  el.innerHTML = '<div class="row" style="gap:8px;flex-wrap:wrap">'+list.slice(0,12).map(p=>`
    <a href="/photos/${p.id}" target="_blank" style="display:block">
      <img src="/photos/${p.id}" style="width:90px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line)"
           onerror="this.style.background='#24324c'" />
      <div class="mut" style="font-size:11px;max-width:90px">${esc(p.caption||ago(p.capturedAt))}</div>
    </a>`).join('')+'</div>';
}

function renderCoParents(list){
  const el=document.getElementById('coStatus');
  if(!el) return;
  el.textContent = list.length ? `Linked with ${list.length} other parent(s).` : 'No co-parent linked yet.';
}

async function inviteCoParent(){
  try{ const r = await api('/co-parents/invite',{method:'POST'});
       prompt('Share this 6-digit code with the other parent (expires in 24h):', r.code); }
  catch(e){ toast(e.message); }
}
async function claimCoParent(){
  const code = document.getElementById('coCode').value.trim();
  if(code.length!==6) return toast('Enter the 6-digit code');
  try{ await api('/co-parents/claim',{method:'POST',body:JSON.stringify({code})});
       document.getElementById('coCode').value=''; toast('Linked!'); refresh(); }
  catch(e){ toast(e.message); }
}
async function recoverDevice(id){
  try{ const r = await api('/devices/'+id+'/recovery-code',{method:'POST'});
       prompt('New recovery pair code (enter on kid device, expires 10 min):', r.code); }
  catch(e){ toast(e.message); }
}
async function addGeofence(deviceId){
  const name = prompt('Name (e.g. "School", "Home"):'); if(!name) return;
  if(!navigator.geolocation) return toast('Geolocation not supported');
  toast('Capturing current location…');
  navigator.geolocation.getCurrentPosition(async pos=>{
    const radius = +prompt('Radius in meters (e.g. 150):', '150') || 150;
    try{ await api('/geofences',{method:'POST',body:JSON.stringify({
      deviceId, name, lat:pos.coords.latitude, lng:pos.coords.longitude,
      radiusMeters:radius, notifyOnEnter:true, notifyOnExit:true,
    })}); toast('Geofence added'); }catch(e){ toast(e.message); }
  }, err=>toast(err.message), {enableHighAccuracy:true});
}

let SCHEDULES = [];
let OPEN_PANELS = new Set();        // device IDs whose Settings panel is open
let EDITING_FIELDS = new Set();     // input IDs the user is currently typing in
const DAYS = ['mon','tue','wed','thu','fri','sat','sun'];
function hhmm(min){ const h=Math.floor(min/60), m=min%60; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }
function toMin(s){ const [h,m]=String(s).split(':').map(Number); return (h||0)*60+(m||0); }

function renderDevices(list){
  const el=document.getElementById('devices');
  if(!list.length){ el.innerHTML='<div class="card mut">No devices yet. Pair one below.</div>'; return; }
  el.innerHTML = list.map(d=>{
    const pct = d.dailyLimitMinutes? Math.min(100, 100*d.usedTodayMinutes/d.dailyLimitMinutes):0;
    const online = d.status!=='offline';
    const net = d.internetBlocked;
    const scheds = SCHEDULES.filter(s=>s.deviceId===d.id);
    const blocklist = (d.blocklist||[]).join(', ');
    return `<div class="card">
      <div class="row">
        <div class="grow"><span class="name">${esc(d.name)}</span>
          <div class="mut">${d.status}${d.lastSeen?(' · seen '+ago(d.lastSeen)):''}</div></div>
        <span class="pill ${online?'on':'off'}">${online?'online':'offline'}</span>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="mut">${fmt(d.usedTodayMinutes)} / ${fmt(d.dailyLimitMinutes)} today · bank ${fmt(d.bankedMinutes)}</div>

      <div class="btns">
        <button class="dng" onclick="cmd('${d.id}','lock')">Lock</button>
        <button class="ok"  onclick="cmd('${d.id}','unlock')">Unlock</button>
        <button class="sec" onclick="cmd('${d.id}','grant_minutes',{minutes:15})">+15 min</button>
        <button class="${net?'ok':'warn'}" onclick="cmd('${d.id}','${net?'unblock_internet':'block_internet'}')">
          ${net?'Internet ON':'Internet OFF'}</button>
      </div>

      <details ${OPEN_PANELS.has(d.id)?'open':''} style="margin-top:12px" ontoggle="this.open?OPEN_PANELS.add('${d.id}'):OPEN_PANELS.delete('${d.id}')">
        <summary style="cursor:pointer;color:var(--mut);font-size:14px;padding:6px 0">⚙️ Settings &amp; limits</summary>

        <div style="margin-top:12px">
          <div class="mut" style="margin-bottom:6px">Daily time limit</div>
          <div class="row">
            <input id="lim_${d.id}" type="number" min="0" max="1440" value="${d.dailyLimitMinutes||0}" class="grow" style="max-width:120px"/>
            <span class="mut">minutes/day</span>
            <button class="sec" onclick="setLimit('${d.id}')">Save</button>
          </div>
          <div class="btns" style="margin-top:6px">
            <button class="sec" onclick="quickLimit('${d.id}',60)">1h</button>
            <button class="sec" onclick="quickLimit('${d.id}',120)">2h</button>
            <button class="sec" onclick="quickLimit('${d.id}',180)">3h</button>
            <button class="sec" onclick="quickLimit('${d.id}',0)">None</button>
          </div>
        </div>

        <div style="margin-top:16px">
          <div class="mut" style="margin-bottom:6px">Blocked apps / games (comma-separated .exe names)</div>
          <input id="bl_${d.id}" value="${esc(blocklist)}" placeholder="discord.exe, steam.exe, minecraft.exe"/>
          <button class="sec" style="margin-top:6px" onclick="setBlocklist('${d.id}')">Save blocklist</button>
        </div>

        <div style="margin-top:16px">
          <div class="mut" style="margin-bottom:6px">Time bank</div>
          <div class="row">
            <input id="bank_${d.id}" type="number" min="0" value="${d.bankedMinutes||0}" class="grow" style="max-width:120px"/>
            <span class="mut">banked min</span>
            <button class="sec" onclick="setBank('${d.id}')">Set</button>
            <button class="sec" onclick="addBank('${d.id}',30)">+30</button>
          </div>
        </div>

        <div style="margin-top:16px">
          <div class="mut" style="margin-bottom:6px">Let kid borrow time (self-service)</div>
          <div class="row">
            <label class="row" style="gap:6px"><input type="checkbox" id="sb_${d.id}" ${d.selfBorrowEnabled?'checked':''} style="width:auto"/> enabled</label>
            <input id="sbcap_${d.id}" type="number" min="0" max="240" value="${d.selfBorrowCapMinutes||30}" style="max-width:90px"/>
            <span class="mut">cap min</span>
            <button class="sec" onclick="setBorrow('${d.id}')">Save</button>
          </div>
        </div>

        <div style="margin-top:16px">
          <div class="mut" style="margin-bottom:6px">Schedules / bedtime (auto lock or block)</div>
          ${scheds.map(s=>`<div class="row" style="margin:4px 0;font-size:14px;background:#0e1626;padding:8px 10px;border-radius:8px">
            <span class="grow">${esc(s.name)} · ${s.days.join(' ')} · ${hhmm(s.startMinute)}–${hhmm(s.endMinute)} · ${(s.actions||['lock']).join('+')}${s.enabled?'':' (off)'}</span>
            <button class="dng" style="padding:6px 10px" onclick="delSchedule('${s.id}')">✕</button>
          </div>`).join('')}
          <div style="background:#0e1626;border:1px dashed var(--line);border-radius:10px;padding:10px;margin-top:8px">
            <input id="sn_${d.id}" placeholder="Name (e.g. Bedtime)" style="margin-bottom:8px"/>
            <div class="mut" style="font-size:12px;margin-bottom:4px">Days</div>
            <div id="sd_${d.id}" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
              ${DAYS.map(day=>`<label class="schday" style="background:#1a2438;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px">
                <input type="checkbox" value="${day}" checked style="display:none" onchange="this.parentNode.style.background=this.checked?'var(--accent)':'#1a2438'"/>${day}
              </label>`).join('')}
            </div>
            <div class="row" style="gap:8px;margin-bottom:10px">
              <div class="grow"><div class="mut" style="font-size:12px">Start</div><input id="ss_${d.id}" type="time" value="21:00"/></div>
              <div class="grow"><div class="mut" style="font-size:12px">End</div><input id="se_${d.id}" type="time" value="07:00"/></div>
            </div>
            <div class="row" style="gap:8px">
              <select id="sa_${d.id}" class="grow" style="padding:11px;border-radius:10px;background:#0e1626;color:var(--fg);border:1px solid var(--line);font-size:15px">
                <option value="lock">Lock screen</option>
                <option value="block_internet">Block internet</option>
                <option value="block_apps">Block apps</option>
              </select>
              <button onclick="saveSchedule('${d.id}')">+ Add schedule</button>
            </div>
          </div>
        </div>
        <style>.schday input:checked + *,.schday:has(input:checked){background:var(--accent)}</style>

        <div class="btns" style="margin-top:16px">
          <button class="sec" onclick="addGeofence('${d.id}')">+ Geofence</button>
          <button class="sec" onclick="renameDevice('${d.id}','${esc(d.name)}')">Rename</button>
          <button class="sec" onclick="recoverDevice('${d.id}')">Recovery code</button>
          <button class="dng" onclick="deleteDevice('${d.id}','${esc(d.name)}')">Delete device</button>
        </div>
      </details>
    </div>`;
  }).join('');
}

async function setLimit(id){ const m=+document.getElementById('lim_'+id).value||0; cmd(id,'set_limit',{minutes:m}); }
async function quickLimit(id,m){ cmd(id,'set_limit',{minutes:m}); }
async function setBlocklist(id){
  const apps=document.getElementById('bl_'+id).value.split(',').map(s=>s.trim()).filter(Boolean);
  cmd(id,'set_blocklist',{apps});
}
async function setBank(id){ const m=+document.getElementById('bank_'+id).value||0; cmd(id,'set_bank_minutes',{minutes:m}); }
async function addBank(id,m){ cmd(id,'add_bank_minutes',{minutes:m}); }
async function setBorrow(id){
  const enabled=document.getElementById('sb_'+id).checked;
  const capMinutes=+document.getElementById('sbcap_'+id).value||0;
  cmd(id,'set_borrow_settings',{enabled,capMinutes});
}
async function renameDevice(id,cur){
  const name=prompt('New device name:',cur); if(!name) return;
  cmd(id,'rename',{name});
}
async function saveSchedule(deviceId){
  const name=(document.getElementById('sn_'+deviceId).value||'').trim() || 'Schedule';
  const days=[...document.querySelectorAll('#sd_'+deviceId+' input:checked')].map(i=>i.value);
  if(!days.length) return toast('Pick at least one day');
  const start=document.getElementById('ss_'+deviceId).value;
  const end=document.getElementById('se_'+deviceId).value;
  if(!start||!end) return toast('Pick start and end times');
  const actions=[document.getElementById('sa_'+deviceId).value];
  const id='sch_'+Math.random().toString(36).slice(2,10);
  try{
    await api('/schedules/'+id,{method:'PUT',body:JSON.stringify({
      deviceId, name, days, startMinute:toMin(start), endMinute:toMin(end), enabled:true, actions
    })});
    toast('Schedule added'); refresh();
  }catch(e){ toast(e.message); }
}
async function deleteDevice(id, name){
  if(!confirm('Delete device "'+name+'"? This wipes all settings, schedules, and history for it. The agent on the kid PC will be unpaired.')) return;
  try{ await api('/devices/'+id,{method:'DELETE'}); toast('Deleted'); refresh(); }
  catch(e){ toast(e.message); }
}
async function delSchedule(id){
  try{ await api('/schedules/'+id,{method:'DELETE'}); toast('Removed'); refresh(); }catch(e){ toast(e.message); }
}
function renderRequests(list){
  const el=document.getElementById('requests');
  if(!list.length){ el.innerHTML=''; return; }
  el.innerHTML='<h2>Time requests</h2>'+list.map(r=>`<div class="card">
    <div class="name">${r.minutes} min</div>
    <div class="mut">${esc(r.reason||'no reason given')}</div>
    <div class="btns">
      <button class="ok"  onclick="resolve('requests','${r.id}','approved')">Approve</button>
      <button class="dng" onclick="resolve('requests','${r.id}','denied')">Deny</button>
    </div></div>`).join('');
}
function renderChores(list){
  const el=document.getElementById('chores');
  if(!list.length){ el.innerHTML=''; return; }
  el.innerHTML='<h2>Chores</h2>'+list.map(c=>`<div class="card">
    <div class="name">${esc(c.description||'chore')}</div>
    <div class="row" style="margin-top:8px">
      <input id="cm_${c.id}" class="grow" type="number" value="${c.minutes||0}" style="max-width:110px" />
      <span class="mut">min reward</span>
    </div>
    <div class="btns">
      <button class="ok" onclick="resolve('chores','${c.id}','approved', +document.getElementById('cm_${c.id}').value)">Approve</button>
      <button class="dng" onclick="resolve('chores','${c.id}','denied')">Deny</button>
    </div></div>`).join('');
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function ago(ts){ const s=Math.max(0,(Date.now()-ts)/1000);
  if(s<60)return Math.floor(s)+'s ago'; if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; }

// boot
fetch(API+'/health').then(()=>{document.getElementById('serverPill').textContent='✓ live';
  document.getElementById('serverPill').className='pill on';})
  .catch(()=>{document.getElementById('serverPill').textContent='offline';
  document.getElementById('serverPill').className='pill off';});
if (TOKEN) showApp();
</script>
</body>
</html>
