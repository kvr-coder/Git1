# Build the timeoff Windows agent installer and publish it to a SEPARATE
# PUBLIC repo (kvr-coder/Downloads). This source repo stays private; the
# Downloads repo only ever contains release artifacts, so anonymous installs
# work without a GitHub login wall.
#
# Triggered on tag push `agent-v*` in this repo. Requires DOWNLOADS_PAT
# (a personal access token with `contents: write` on kvr-coder/Downloads)
# set as a repo secret here.
#
# Permanent download URL the parent app reads (always latest):
#   https://github.com/kvr-coder/Downloads/releases/latest/download/timeoff-agent-setup.exe

name: Release agent installer

on:
  push:
    tags:
      - 'agent-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (without leading v)'
        required: true
        default: '0.0.0-dev'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # True only when a signing cert secret is present, so the sign step below is
    # a clean no-op until the cert is configured.
    env:
      HAS_CODESIGN: ${{ secrets.CODESIGN_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -like 'agent-v*') {
            $v = $tag.Substring(7)
          } else {
            $v = "${{ inputs.version }}"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Stage bundled runtimes (best-effort, optional)
        # Builds a self-contained Python (embeddable + pip + agent deps) and a
        # portable Git into installer\payload so the installer no longer downloads
        # and silently runs the python.org / git-for-windows installers on the kid
        # PC — the main AV/SmartScreen heuristic. continue-on-error: if anything
        # here fails, the .iss [Files] entries are skipifsourcedoesntexist and the
        # .ps1 falls back to its winget/download path, so the release still ships.
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $payload = "installer\payload"
          New-Item -ItemType Directory -Force -Path "$payload\python" | Out-Null
          New-Item -ItemType Directory -Force -Path "$payload\git" | Out-Null

          # --- Python embeddable + pip + agent deps ---
          $pyVer = '3.12.7'
          $pyZip = "$env:RUNNER_TEMP\python-embed.zip"
          Invoke-WebRequest -UseBasicParsing -Uri "https://www.python.org/ftp/python/$pyVer/python-$pyVer-embed-amd64.zip" -OutFile $pyZip
          Expand-Archive -Path $pyZip -DestinationPath "$payload\python" -Force
          # Enable site-packages so pip-installed deps are importable from the embeddable.
          $pth = Get-ChildItem "$payload\python\python*._pth" | Select-Object -First 1
          (Get-Content $pth.FullName) -replace '^#\s*import site', 'import site' | Set-Content $pth.FullName
          # Bootstrap pip, then install the agent's deps into the bundled interpreter.
          Invoke-WebRequest -UseBasicParsing -Uri 'https://bootstrap.pypa.io/get-pip.py' -OutFile "$env:RUNNER_TEMP\get-pip.py"
          & "$payload\python\python.exe" "$env:RUNNER_TEMP\get-pip.py" --no-warn-script-location
          & "$payload\python\python.exe" -m pip install --no-warn-script-location -r agent\requirements.txt
          # Native deps must load in the bundled interpreter or the bundle is useless.
          & "$payload\python\python.exe" -c "import win32api, psutil, websockets, PIL, pystray, ntplib, requests"

          # --- Portable Git (MinGit) ---
          $mgUrl = (Invoke-RestMethod -UseBasicParsing -Uri 'https://api.github.com/repos/git-for-windows/git/releases/latest').assets |
            Where-Object { $_.name -match 'MinGit-.*-64-bit\.zip$' -and $_.name -notmatch 'busybox' } |
            Select-Object -First 1 -ExpandProperty browser_download_url
          if (-not $mgUrl) { $mgUrl = 'https://github.com/git-for-windows/git/releases/download/v2.47.0.windows.1/MinGit-2.47.0-64-bit.zip' }
          $mgZip = "$env:RUNNER_TEMP\mingit.zip"
          Invoke-WebRequest -UseBasicParsing -Uri $mgUrl -OutFile $mgZip
          Expand-Archive -Path $mgZip -DestinationPath "$payload\git" -Force
          if (-not (Test-Path "$payload\git\cmd\git.exe")) { throw "MinGit layout unexpected" }
          Write-Host "Bundled runtimes staged OK."

      - name: Build installer
        shell: pwsh
        env:
          TIMEOFF_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Qp installer\timeoff-agent.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Sign installer (skips when no signing cert configured)
        # Authenticode signing is THE highest-impact lever against SmartScreen.
        # Gated on the CODESIGN_PFX_BASE64 / CODESIGN_PASSWORD repo secrets so
        # this is a no-op until a cert exists. To enable: base64-encode your
        # .pfx and add it (plus its password) as Actions secrets — signing then
        # turns on automatically on the next agent-v* tag. EV certs need an HSM/
        # cloud-KMS flow instead of a .pfx; adjust this step when you get one.
        if: env.HAS_CODESIGN == 'true'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found on runner' }
          & $signtool.FullName sign /f $pfx /p $env:PFX_PASS /fd SHA256 `
            /tr http://timestamp.sectigo.com /td SHA256 `
            installer\Output\timeoff-agent-setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed' }
          Remove-Item $pfx -Force
          Write-Host 'Installer signed.'

      - name: Stage script installer (BAT fallback)
        shell: pwsh
        run: |
          # Copy the one-file BAT next to the EXE so it's a sibling download.
          # Antivirus that blocks the unsigned EXE usually lets a plain .bat
          # through, and vice versa — having both means at least one path
          # works on every kid PC without us scrambling.
          New-Item -ItemType Directory -Force -Path installer\Output | Out-Null
          Copy-Item scripts\Install-Git1-Kid-OneFile.bat installer\Output\timeoff-agent-setup.bat
          $h = (Get-FileHash installer\Output\timeoff-agent-setup.bat -Algorithm SHA256).Hash.ToLower()
          "$h  timeoff-agent-setup.bat" | Out-File -Encoding ascii installer\Output\timeoff-agent-setup.bat.sha256

      - name: Hash installer
        id: hash
        shell: pwsh
        run: |
          $f = Get-ChildItem installer\Output\timeoff-agent-setup.exe
          $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
          "sha256=$h" >> $env:GITHUB_OUTPUT
          "$h  timeoff-agent-setup.exe" | Out-File -Encoding ascii installer\Output\timeoff-agent-setup.exe.sha256

      - name: Publish release to public Downloads repo
        uses: softprops/action-gh-release@v2
        with:
          repository: kvr-coder/Downloads
          token: ${{ secrets.DOWNLOADS_PAT }}
          name: timeoff agent ${{ steps.ver.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## timeoff agent ${{ steps.ver.outputs.version }}

            **Direct download:** [timeoff-agent-setup.exe](https://github.com/kvr-coder/Downloads/releases/latest/download/timeoff-agent-setup.exe)

            **SHA256:** `${{ steps.hash.outputs.sha256 }}`

            **Unsigned for now.** First run may show a SmartScreen "Unrecognized app" warning — click *More info → Run anyway*. We submit each release to Microsoft for whitelisting; reputation builds over a few days.
          files: |
            installer/Output/timeoff-agent-setup.exe
            installer/Output/timeoff-agent-setup.exe.sha256
            installer/Output/timeoff-agent-setup.bat
            installer/Output/timeoff-agent-setup.bat.sha256
