name: Keep server warm

# Pings the Render /health endpoint on a schedule so the free-tier instance
# doesn't spin down. Render free sleeps after ~15 min idle, adding a 30-60s
# cold start to the next request — which is what made the kid PC fail to pair
# the first time. Keeping it warm removes that window.
#
# NOTES:
#  * Scheduled workflows only run from the repository's DEFAULT branch, and
#    GitHub's free cron is best-effort (it can be delayed under load). Merge
#    this file to the default branch for the schedule to actually fire.
#  * Override the target by setting a repo variable GIT1_SERVER_URL
#    (Settings -> Secrets and variables -> Actions -> Variables).

on:
  schedule:
    - cron: '*/10 * * * *'   # every ~10 minutes
  workflow_dispatch:          # allow manual runs / testing

# Never pile up overlapping runs; the newest ping is all that matters.
concurrency:
  group: keep-warm
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (wake + keep warm)
        env:
          SERVER_URL: ${{ vars.GIT1_SERVER_URL || 'https://git1-server.onrender.com' }}
        run: |
          set -u
          url="${SERVER_URL%/}/health"
          echo "Pinging $url"
          for i in 1 2 3 4 5 6; do
            code=$(curl -fsS -m 60 -o /tmp/out.txt -w '%{http_code}' "$url" || echo "000")
            body=$(cat /tmp/out.txt 2>/dev/null || true)
            echo "attempt $i -> HTTP $code  body: $body"
            if [ "$code" = "200" ]; then
              echo "Server is awake."
              exit 0
            fi
            echo "not ready (cold start?) — waiting 20s before retry"
            sleep 20
          done
          echo "::error::Server did not return 200 after retries ($url)"
          exit 1
