name: EAS Update

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

jobs:
  update:
    name: Publish OTA update
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        # `npm install` (not `ci`) so the OTA still ships when package-lock
        # drifts from package.json mid-iteration — common when only mobile
        # source files change but a transitive dep bumped. Lockfile is
        # refreshed on the runner; not committed back.
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Ensure EAS project exists
        # `eas update` errors out in non-interactive mode if app.json has no
        # `extra.eas.projectId`. `eas init --non-interactive --force` creates
        # (or links) the project under the authenticated account and writes
        # the projectId into app.json. We commit that change locally for the
        # current run but don't push it back — projectId is idempotent so
        # subsequent runs just verify it.
        run: |
          if ! node -e "const c=require('./app.json'); process.exit(c.expo?.extra?.eas?.projectId ? 0 : 1)"; then
            npx eas init --non-interactive --force
          fi

      - name: Publish update
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          # Map non-main branches to the "preview" channel; main goes to "production"
          if [ "$BRANCH" = "main" ]; then
            CHANNEL="production"
          else
            CHANNEL="preview"
          fi
          eas update \
            --branch "$CHANNEL" \
            --message "${GITHUB_SHA::7}: $(git log -1 --pretty=%s)" \
            --non-interactive
